  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'Cormorant Garamond',serif}.viewport{position:fixed;inset:0;background:#000}.game-container{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}.spline-stage{position:absolute;inset:0;z-index:1;overflow:hidden}spline-viewer{position:absolute;inset:0;width:100%;height:100%;z-index:3;opacity:0;transform:scale(1.02);transition:opacity 1.6s ease,transform 1.6s ease}spline-viewer.show{opacity:1;transform:scale(1)}.poster-image{position:absolute;inset:0;width:100%;height:100%;z-index:2;object-fit:cover;opacity:1;transition:opacity 1.1s ease}.poster-image.hide{opacity:0}.loading-overlay{position:absolute;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(63,124,0,.14),transparent 42%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.035),transparent 50%);opacity:1;transition:opacity 1.1s ease,visibility 1.1s ease}.loading-overlay.hide{opacity:0;visibility:hidden}.loading-orb{position:relative;width:4.4rem;height:4.4rem;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,.04) 56%,rgba(255,255,255,.01));box-shadow:0 0 28px rgba(184,255,79,.16),inset 0 0 14px rgba(255,255,255,.04);animation:orbSpin 5.5s linear infinite,orbFloat 4.4s ease-in-out infinite}.loading-orb::before{content:"";position:absolute;inset:.5rem;border-radius:50%;border:1px solid rgba(255,255,255,.08)}.orb-dot{position:absolute;width:.42rem;height:.42rem;border-radius:50%;background:radial-gradient(circle,#fff,rgba(184,255,79,.92) 46%,rgba(184,255,79,.08));box-shadow:0 0 10px rgba(255,255,255,.85),0 0 20px rgba(184,255,79,.45)}.orb-dot-1{top:-.12rem;left:50%;transform:translateX(-50%)}.orb-dot-2{right:.4rem;bottom:.8rem}.orb-dot-3{left:.45rem;bottom:.72rem}@keyframes orbSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes orbFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}.loading-copy-box{padding:1rem 1.35rem;min-width:min(86vw,34rem);max-width:min(94vw,44rem);border-radius:1.1rem;border:1px solid rgba(255,255,255,.12);background:rgba(8,8,10,.24);backdrop-filter:blur(12px);box-shadow:0 0 24px rgba(0,0,0,.22),inset 0 0 16px rgba(255,255,255,.03);text-align:center;animation:boxFloat 4.8s ease-in-out infinite}.loading-kicker{margin-bottom:.45rem;font-size:clamp(.62rem,.8vw,.72rem);letter-spacing:.24em;color:rgba(184,255,79,.48)}.loading-copy{height:1.8em;color:rgba(255,255,255,.92);font-size:clamp(.98rem,1.45vw,1.22rem);line-height:1.45;letter-spacing:.04em;white-space:nowrap}.loading-copy span{display:block}@keyframes boxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.particles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.particle{position:absolute;border-radius:50%;opacity:0;width:var(--size);height:var(--size);background:radial-gradient(circle,var(--color) 0%,transparent 70%);box-shadow:0 0 calc(var(--size)*2) var(--color);animation:floatUp linear infinite,flicker ease-in-out infinite}@keyframes floatUp{0%{transform:translate3d(0,3vh,0) scale(.9);opacity:0}15%{opacity:1}50%{transform:translate3d(1vw,-8vh,0) scale(1)}100%{transform:translate3d(-1vw,-18vh,0) scale(.85);opacity:0}}@keyframes flicker{0%,100%{opacity:.15}50%{opacity:.95}}.top-nav{position:absolute;top:3%;left:2%;z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:.65rem}.menu-toggle-btn{position:relative;width:clamp(2.5rem,3.2vw,3.2rem);height:clamp(2.5rem,3.2vw,3.2rem);border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 .8vw rgba(157,255,58,.22),inset 0 0 .35vw rgba(255,255,255,.1);transition:all .3s ease}.menu-toggle-btn:hover{transform:scale(1.08)}.menu-toggle-btn::before{content:"";width:clamp(.72rem,.95vw,.95rem);height:clamp(.72rem,.95vw,.95rem);border-radius:50%;background:#9dff3a;box-shadow:0 0 .6vw rgba(157,255,58,.6),0 0 1.2vw rgba(125,255,0,.32)}.menu-toggle-btn span{position:absolute;width:1.1rem;height:1px;border-radius:999px;background:rgba(232,255,242,.88);box-shadow:0 0 .35vw rgba(184,255,79,.45);transition:transform .28s ease,opacity .28s ease}.menu-toggle-btn span:nth-child(1){transform:translateY(-.32rem)}.menu-toggle-btn span:nth-child(2){transform:translateY(0)}.menu-toggle-btn span:nth-child(3){transform:translateY(.32rem)}.top-nav.open .menu-toggle-btn span:nth-child(1){transform:rotate(45deg)}.top-nav.open .menu-toggle-btn span:nth-child(2){opacity:0}.top-nav.open .menu-toggle-btn span:nth-child(3){transform:rotate(-45deg)}.nav-menu{min-width:11.5rem;padding:.9rem 1rem;border-radius:1.15rem;margin-left:.15rem;display:flex;flex-direction:column;gap:.72rem;background:rgba(4,12,8,.36);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 0 1vw rgba(157,255,58,.14),0 0 1.8vw rgba(0,0,0,.22),inset 0 0 .45vw rgba(255,255,255,.07);opacity:0;transform:translateY(-.35rem) scale(.96);pointer-events:none;transition:opacity .32s ease,transform .32s ease}.top-nav.open .nav-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.nav-link{font-family:'Jost',sans-serif;font-size:clamp(.78rem,.86vw,.92rem);letter-spacing:.16em;font-weight:500;color:rgba(184,255,79,.82);cursor:pointer;padding:.48rem .65rem;border-radius:999px;transition:.28s}.nav-link:hover{color:rgba(244,255,248,.98);background:rgba(255,255,255,.07);transform:translateX(3px)}.mode-toggle{position:absolute;top:3%;right:3%;width:3.3rem;height:1.68rem;border-radius:999px;z-index:20;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px)}.toggle-knob{position:absolute;top:50%;left:.18rem;width:1.26rem;height:1.26rem;border-radius:50%;transform:translateY(-50%);background:rgba(255,255,255,.92);transition:left .28s ease}.mode-toggle.active .toggle-knob{left:1.84rem}.back-btn,.detail-trigger{position:absolute;left:50%;transform:translateX(-50%);z-index:25;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(3,10,7,.35);backdrop-filter:blur(14px);font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.24em;color:rgba(184,255,79,.78);cursor:pointer;white-space:nowrap;transition:.3s}.back-btn{top:3%;padding:.58rem 1.5rem;font-size:.7rem}.detail-trigger{bottom:8%;padding:.72rem 2rem;font-size:clamp(.68rem,.78vw,.8rem);transform:translateX(-50%) translateY(0)}.back-btn:hover,.detail-trigger:hover{background:rgba(90,170,0,.18);color:rgba(184,255,79,.95)}.gem-detail-modal{position:absolute;inset:0;z-index:65;opacity:0;pointer-events:none;transition:opacity .35s ease}.gem-detail-modal.show{opacity:1;pointer-events:auto}.gem-detail-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(12px)}.gem-detail-panel{position:absolute;left:50%;top:50%;width:min(62vw,58rem);height:min(82vh,44rem);transform:translate(-50%,-50%) scale(.92);border-radius:1.35rem;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));backdrop-filter:blur(24px);box-shadow:0 0 2vw rgba(0,0,0,.22),inset 0 0 1vw rgba(255,255,255,.08);overflow:hidden;transition:transform .35s ease}.gem-detail-modal.show .gem-detail-panel{transform:translate(-50%,-50%) scale(1)}.gem-detail-close{position:absolute;top:.9rem;right:.9rem;z-index:3;width:2.1rem;height:2.1rem;border:none;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.82);font-size:1.15rem}.gem-detail-head{position:absolute;top:1rem;left:1.1rem;right:3.5rem;z-index:2}.gem-detail-kicker{font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.18em;color:rgba(255,255,255,.45);margin-bottom:.8rem}.gem-detail-head h3{margin:0 0 1rem 0;font-size:clamp(1.08rem,1.35vw,1.55rem);font-weight:600;color:rgba(255,255,255,.95);transform:translateY(-.35rem)}.gem-detail-viewer{position:absolute;inset:4.6rem 0 0 0}.gem-detail-viewer spline-viewer{opacity:1;transform:none}.transition-overlay{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99999;transition:opacity .8s ease}.transition-overlay.show{opacity:1}.music-btn{position:absolute;bottom:6%;right:4%;width:clamp(2.5rem,3.2vw,3.2rem);height:clamp(2.5rem,3.2vw,3.2rem);border-radius:50%;z-index:30;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);transition:.3s}.music-btn:hover{transform:scale(1.08)}.music-inner{width:clamp(.7rem,.9vw,.9rem);height:clamp(.7rem,.9vw,.9rem);border-radius:50%;background:#9dff3a;box-shadow:0 0 .6vw rgba(157,255,58,.6)}.music-label{position:absolute;left:50%;bottom:-1.55rem;transform:translateX(-50%);width:max-content;min-width:6.2rem;font-size:.9rem;letter-spacing:.08em;text-align:center;white-space:nowrap;color:rgba(255,255,255,.62)}.music-btn.playing .music-label{color:rgba(184,255,79,.95)}@media(max-width:860px){.gem-detail-panel{width:min(92vw,58rem)}.detail-trigger{bottom:10%}}

</head>
<body>
  <div class="viewport"><div class="game-container">
    <div class="top-nav" id="topNav"><button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기"><span></span><span></span><span></span></button><div class="nav-menu"><div class="nav-link" onclick="goOverview()">OVERVIEW</div><div class="nav-link" onclick="goMenu()">MAIN MENU</div><div class="nav-link" onclick="goCollectGem()">COLLECT YOUR GEM</div></div></div>
    <div class="mode-toggle" id="modeToggle"><div class="toggle-knob"></div></div>
    <div class="spline-stage"><img id="posterImage" class="poster-image" src="./Peridot view image.jpg" alt="Spline preview" fetchpriority="high"><script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.95/build/spline-viewer.js"></script><spline-viewer id="splineScene" loading="eager" hint loading-anim-type="spinner-small-light" url="https://prod.spline.design/g6gmTRiqZKwtL3gK/scene.splinecode"></spline-viewer></div>
    <div id="loadingOverlay" class="loading-overlay"><div class="loading-orb"><span class="orb-dot orb-dot-1"></span><span class="orb-dot orb-dot-2"></span><span class="orb-dot orb-dot-3"></span></div><div class="loading-copy-box"><div class="loading-kicker">AWAKENING</div><div class="loading-copy"><span>페리도트의 3D 공간을 불러오는 중입니다</span></div></div></div>
    <div class="particles" id="particles"></div>
    <button class="back-btn" id="backBtn">← Return to Overview</button>
    <button class="detail-trigger" id="detailTrigger">EXPLORE PERIDOT</button>
    <div class="gem-detail-modal" id="gemDetailModal"><div class="gem-detail-backdrop" id="gemDetailBackdrop"></div><div class="gem-detail-panel"><button class="gem-detail-close" id="gemDetailClose" aria-label="닫기">×</button><div class="gem-detail-head"><div class="gem-detail-kicker">DEEP VIEW</div><h3>Peridot Structure</h3></div><div class="gem-detail-viewer" id="gemDetailViewer"></div></div></div>
    <div class="music-btn" id="musicBtn"><div class="music-inner"></div><div class="music-label">music on</div></div>
    <div class="transition-overlay" id="transitionOverlay"></div>
    <audio id="bgm" loop><source src="./가넷노래.mp3" type="audio/mpeg"></audio>
  </div></div>
<script>
  const spline=document.getElementById('splineScene');const posterImage=document.getElementById('posterImage');const loadingOverlay=document.getElementById('loadingOverlay');const particlesWrap=document.getElementById('particles');const overlay=document.getElementById('transitionOverlay');const backBtn=document.getElementById('backBtn');const detailTrigger=document.getElementById('detailTrigger');const gemDetailModal=document.getElementById('gemDetailModal');const gemDetailClose=document.getElementById('gemDetailClose');const gemDetailBackdrop=document.getElementById('gemDetailBackdrop');const gemDetailViewer=document.getElementById('gemDetailViewer');const topNav=document.getElementById('topNav');const menuToggleBtn=document.getElementById('menuToggleBtn');const toggle=document.getElementById('modeToggle');const musicBtn=document.getElementById('musicBtn');const musicLabel=document.querySelector('.music-label');const audio=document.getElementById('bgm');let secondSplineLoaded=false;let revealed=false;
  function revealSpline(){if(revealed)return;revealed=true;spline.classList.add('show');posterImage.classList.add('hide');loadingOverlay.classList.add('hide');loadingOverlay.addEventListener('transitionend',()=>loadingOverlay.remove(),{once:true})}
  function waitForCanvas(){const tryFind=()=>{const shadow=spline.shadowRoot;if(!shadow)return false;const canvas=shadow.querySelector('canvas');if(!canvas)return false;let frames=0;function waitFrames(){frames++;if(frames<8){requestAnimationFrame(waitFrames);return}setTimeout(revealSpline,800)}requestAnimationFrame(waitFrames);return true};if(tryFind())return;const observer=new MutationObserver(()=>{if(tryFind())observer.disconnect()});observer.observe(spline,{childList:true,subtree:true})}
  spline.addEventListener('load',waitForCanvas);setTimeout(revealSpline,9000);
  function createParticles(total=45){const frag=document.createDocumentFragment();for(let i=0;i<total;i++){const p=document.createElement('div');p.className='particle';let left,top;while(true){left=Math.random()*100;top=Math.random()*100;const dx=left-50,dy=top-50;if(Math.sqrt(dx*dx+dy*dy)>40)break}p.style.left=`${left}%`;p.style.top=`${top}%`;const rand=Math.random();const size=rand<.65?Math.random()*.5+.15:rand<.9?Math.random()*.6+.2:Math.random()*.5+.5;p.style.setProperty('--size',`${size}vw`);const r=200+Math.random()*35,g=240+Math.random()*15,b=220+Math.random()*30,a=.45+Math.random()*.25;p.style.setProperty('--color',`rgba(${r},${g},${b},${a})`);p.style.animationDuration=`${7+Math.random()*8}s, ${2+Math.random()*4}s`;p.style.animationDelay=`${Math.random()*5}s, ${Math.random()*2}s`;frag.appendChild(p)}particlesWrap.appendChild(frag)}
  window.addEventListener('DOMContentLoaded',()=>createParticles(window.innerWidth<=768?28:45));
  backBtn.addEventListener('click',()=>{overlay.classList.add('show');setTimeout(()=>{window.location.href='Peridot_view_light.html'},550)});
  detailTrigger.addEventListener('click',()=>{if(!secondSplineLoaded){const viewer=document.createElement('spline-viewer');viewer.setAttribute('url','https://prod.spline.design/1Qfdz0dTPmWdBZC6/scene.splinecode');gemDetailViewer.appendChild(viewer);secondSplineLoaded=true}gemDetailModal.classList.add('show')});
  function closeGemDetail(){gemDetailModal.classList.remove('show')}gemDetailClose.addEventListener('click',closeGemDetail);gemDetailBackdrop.addEventListener('click',closeGemDetail);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeGemDetail()});
  menuToggleBtn.addEventListener('click',e=>{e.stopPropagation();topNav.classList.toggle('open')});window.addEventListener('click',e=>{if(!topNav.contains(e.target))topNav.classList.remove('open')});
  toggle.addEventListener('click',()=>{toggle.classList.toggle('active');overlay.classList.add('show');setTimeout(()=>{window.location.href='Peridot_star_view.html'},800)});
  musicBtn.addEventListener('click',async e=>{e.stopPropagation();audio.volume=.45;try{if(audio.paused){await audio.play();musicBtn.classList.add('playing');musicLabel.textContent='music off'}else{audio.pause();musicBtn.classList.remove('playing');musicLabel.textContent='music on'}}catch(err){console.error(err)}});
  function goOverview(){overlay.classList.add('show');setTimeout(()=>{window.location.href='Peridot_view_light.html'},550)}function goMenu(){overlay.classList.add('show');setTimeout(()=>{window.location.href='The gem I am.html'},700)}function goCollectGem(){overlay.classList.add('show');setTimeout(()=>{window.location.href='gem collection.html'},700)}
</script>
</body>
